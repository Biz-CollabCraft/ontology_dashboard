<!DOCTYPE html>
<html>
<head>
<script type="module" src="../src/standalone/main.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<dialog id="session-dialog" aria-label="세션 및 프로젝트 선택" style="font:14px IBM Plex Sans KR,system-ui;border:1px solid #C3D3E6;padding:20px"></dialog>
<template id="factory-template">
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#EDF1F7"/><rect x="30" y="30" width="40" height="40" fill="#FFFFFF" stroke="#0F1E33" stroke-width="2"/><path d="M34 62 L44 55 L52 46 L60 38 L66 34" fill="none" stroke="#B93A28" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="30" y1="43" x2="70" y2="43" stroke="#C98A14" stroke-width="1.5" stroke-dasharray="3 3"/></svg></template>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #EDF1F7; }
  body { font-family: "IBM Plex Sans KR", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #003C96; text-decoration: none; }
  a:hover { color: #002B6B; text-decoration: underline; }
  @keyframes livepulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.72); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes signalrise { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slidein { from { transform: translateX(28px); opacity: .4; } to { transform: translateX(0); opacity: 1; } }
  @keyframes slidestep { from { transform: translateX(0); } to { transform: translateX(-14.667px); } }
  @keyframes refill { from { width: 0%; } to { width: 100%; } }
  @keyframes barslide { from { transform: translateX(0); } to { transform: translateX(-8.108%); } }
  @keyframes ringpulse { 0%,100% { outline: 2px solid rgba(60,180,200,0); } 50% { outline: 2px solid rgba(60,180,200,.95); } }

.recovery-button { font-family:inherit;font-size:11.5px;font-weight:600;padding:7px 11px;border:1px solid #003C96;background:#FFF;color:#003C96;cursor:pointer; }
.recovery-button:disabled { color:#7C90A8;border-color:#DDE6F0;cursor:default; }
.recovery-input { width:72px;border:1px solid #C3D3E6;padding:6px;font-family:'IBM Plex Mono',monospace; }
.recovery-button:focus-visible,.recovery-input:focus-visible {outline:2px solid #003C96;outline-offset:2px;}
</style>
</helmet>
<div style="min-height:100vh;background:#EDF1F7;color:#0F1E33;padding:14px;display:flex;flex-direction:column;gap:12px">

  <header style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:2px solid #003C96;padding-bottom:10px">
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <div style="display:flex;gap:2px;flex:none">
        <button type="button" onClick="{{ onRoleShift }}" style="border:1px solid {{ shiftBorder }};background:{{ shiftBg }};color:{{ shiftFg }};font-family:inherit;font-size:12px;font-weight:{{ shiftW }};padding:7px 13px;cursor:pointer;white-space:nowrap;letter-spacing:-0.01em;display:flex;align-items:center;gap:7px">엔지니어 · 지금<span style="font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;background:{{ shiftBadgeBg }};color:{{ shiftBadgeFg }};padding:1px 5px;line-height:1.4">{{ shiftBadge }}</span></button>
        <button type="button" onClick="{{ onRolePlan }}" style="border:1px solid {{ planBorder }};background:{{ planBg }};color:{{ planFg }};font-family:inherit;font-size:12px;font-weight:{{ planW }};padding:7px 13px;cursor:pointer;white-space:nowrap;letter-spacing:-0.01em;display:flex;align-items:center;gap:7px">생산관리자 · 오늘<span style="font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;background:{{ planBadgeBg }};color:{{ planBadgeFg }};padding:1px 5px;line-height:1.4">{{ planBadge }}</span></button>
        <button type="button" onClick="{{ onRoleMaint }}" style="border:1px solid {{ maintBorder }};background:{{ maintBg }};color:{{ maintFg }};font-family:inherit;font-size:12px;font-weight:{{ maintW }};padding:7px 13px;cursor:pointer;white-space:nowrap;letter-spacing:-0.01em;display:flex;align-items:center;gap:7px">보전팀 · 작업 큐<span style="font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;background:{{ maintBadgeBg }};color:{{ maintBadgeFg }};padding:1px 5px;line-height:1.4">{{ maintBadge }}</span></button>
      </div>
      <h1 style="margin:0;font-size:23px;font-weight:700;letter-spacing:-0.02em">공장 현황</h1>
      <button type="button" title="프로젝트·워크스페이스·세션" onClick="{{ onSession }}" style="font:inherit;font-size:12.5px;color:#4A5C74;font-weight:500;border:0;background:none;padding:0;cursor:pointer">{{ siteLabel }}</button>
    </div>
    <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:7px">
        <span style="width:8px;height:8px;border-radius:50%;background:#3CB4C8;display:block;animation:livepulse 2s ease-in-out infinite"></span>
        <span style="font-size:12px;color:#2C4159;font-weight:600">{{ sourceLabel }}</span>
      </div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#4A5C74">기준 시각 {{ nowLabel }}</div>
      <div style="font-size:11.5px;color:#4A5C74;border:1px solid #C3D3E6;background:#FFF;padding:4px 8px;font-weight:500;white-space:nowrap">예측 구간 {{ horizonLabel }}</div>
    </div>
  </header>

  <section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px">
    <sc-for list="{{ kpis }}" as="k" hint-placeholder-count="3">
      <div style="background:#FFFFFF;border:1px solid #CBD8E8;border-top:3px solid #003C96;padding:14px 16px 15px;display:flex;flex-direction:column;gap:9px;min-width:0">
        <div style="font-size:12.5px;font-weight:600;color:#3B5170;letter-spacing:-0.01em">{{ k.label }}</div>
        <div style="display:flex;align-items:baseline;gap:7px">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:40px;font-weight:600;line-height:0.9;letter-spacing:-0.03em">{{ k.value }}</span>
          <span style="font-size:14px;font-weight:600;color:#4A5C74">{{ k.unit }}</span>
        </div>
        <div style="font-size:11.5px;color:#5A6E88;line-height:1.5;text-wrap:pretty">{{ k.note }}</div>
      </div>
    </sc-for>
  </section>

  <section style="display:grid;grid-template-columns:{{ gridCols }};gap:12px;align-items:start;transition:grid-template-columns .36s cubic-bezier(.2,0,0,1)">

    <sc-if value="{{ isMaint }}" hint-placeholder-val="{{ false }}">
      <div style="background:#FFFFFF;border:1px solid #CBD8E8;padding:13px 14px 15px;display:flex;flex-direction:column;gap:10px;min-width:0">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid #DDE6F0;padding-bottom:8px">
          <h2 style="margin:0;font-size:15px;font-weight:700;letter-spacing:-0.01em;white-space:nowrap">받은 요청 큐</h2>
          <span style="font-size:10.5px;color:#4A5C74;font-weight:600">미완료 {{ reqCount }}</span>
        </div>
        <sc-for list="{{ reqQueue }}" as="rq" hint-placeholder-count="1">
          <div role="button" tabindex="0" onClick="{{ rq.onSelect }}" style="border:{{ rq.border }};border-left:4px solid {{ rq.color }};background:{{ rq.bg }};padding:11px 12px;cursor:pointer;display:flex;flex-direction:column;gap:7px;min-width:0">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
              <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#4A5C74;flex:none">{{ rq.id }}</span>
              <span style="font-size:10.5px;font-weight:700;color:{{ rq.ink }};background:{{ rq.tint }};padding:2px 7px;white-space:nowrap;flex:none">{{ rq.state }}</span>
            </div>
            <div style="font-size:13px;font-weight:700;color:#0F1E33;line-height:1.4;text-wrap:pretty">{{ rq.what }}</div>
            <div style="display:flex;flex-direction:column;gap:2px;font-size:11px;color:#4A5C74">
              <span style="font-weight:600;color:#0F1E33">{{ rq.assetName }} · {{ rq.target }}</span>
              <span>{{ rq.place }}</span>
              <span style="color:#566B85">요청 {{ rq.from }} · {{ rq.age }} · 담당 {{ rq.assignee }}</span>
            </div>
            <button type="button" onClick="{{ rq.onAdvance }}" style="align-self:flex-start;display:{{ rq.nextShow }};border:1px solid #003C96;background:#003C96;color:#FFFFFF;font-family:inherit;font-size:11px;font-weight:600;padding:5px 10px;cursor:pointer;white-space:nowrap" style-hover="background:#002B6B">{{ rq.nextLabel }} →</button>
          </div>
        </sc-for>
        <div style="font-size:11px;color:#566B85;line-height:1.6">{{ reqEmpty }}</div>
      </div>
    </sc-if>

    <div onClick="{{ onFocusMap }}" title="빈 곳을 누르면 설비 맵을 크게 봅니다" style="display:{{ mapShow }};background:#FFFFFF;border:1px solid #CBD8E8;padding:13px 14px 15px;flex-direction:column;gap:11px;min-width:0;cursor:{{ zoomCursor }}">
      <div style="display:flex;flex-direction:column;gap:7px;border-bottom:1px solid #DDE6F0;padding-bottom:9px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <h2 style="margin:0;font-size:15px;font-weight:700;letter-spacing:-0.01em;white-space:nowrap">라인 · 셀 · 설비 상태</h2>
          <button type="button" onClick="{{ onFocusMap }}" title="설비 맵 크게 보기" disabled="{{ mapIsBig }}" style="flex:none;width:26px;height:26px;border:1px solid {{ zoomBorder }};background:{{ zoomBg }};color:{{ zoomFg }};cursor:{{ zoomCursor }};font-family:inherit;font-size:13px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center" style-hover="border-color:#003C96">⤢</button>
        </div>
        <div style="display:flex;align-items:center;gap:8px;min-width:0">
          <span style="display:{{ legendShow }};align-items:center;gap:4px;white-space:nowrap;flex:none"><span style="font-size:11px;font-weight:700;color:#003C96;margin-right:2px">우선 순위</span><span style="display:flex;width:14px;height:14px;background:#003C96;color:#FFFFFF;font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;line-height:1;align-items:center;justify-content:center">1</span><span style="display:flex;width:14px;height:14px;background:#003C96;color:#FFFFFF;font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;line-height:1;align-items:center;justify-content:center">2</span><span style="display:flex;width:14px;height:14px;background:#003C96;color:#FFFFFF;font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;line-height:1;align-items:center;justify-content:center">3</span></span>
          <div style="flex:1;height:4px;background:#EAF0F7;overflow:hidden;min-width:24px" title="서버 조회 기준">
            <div style="height:100%;background:#3CB4C8;animation:{{ refillAnim }}"></div>
          </div>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#4A5C74;white-space:nowrap;flex:none">{{ refillLabel }}</span>
        </div>
      </div>
      <sc-for list="{{ lines }}" as="ln" hint-placeholder-count="4">
        <div style="display:flex;flex-direction:column;gap:5px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
            <span style="font-size:12px;font-weight:600;color:#1E3450">{{ ln.name }}</span>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#566B85">{{ ln.summary }}</span>
          </div>
          <sc-for list="{{ ln.cells }}" as="cl" hint-placeholder-count="2">
            <div style="display:flex;align-items:center;gap:7px">
              <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#5F7590;width:30px;flex:none">{{ cl.name }}</span>
              <div style="display:flex;gap:5px;flex:1;min-width:0">
                <sc-for list="{{ cl.assets }}" as="a" hint-placeholder-count="3">
                  <button type="button" onClick="{{ a.onSelect }}" title="{{ a.title }}" style="position:relative;flex:1;min-width:0;height:{{ a.tileH }};transition:height .3s cubic-bezier(.2,0,0,1);border:{{ a.border }};background:{{ a.bg }};color:{{ a.fg }};cursor:pointer;padding:{{ a.tilePad }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:'IBM Plex Mono',monospace;outline-offset:-1px;overflow:hidden;animation:{{ a.pulse }}" style-hover="filter:brightness(.96)">
                    <span style="position:absolute;top:3px;left:3px;width:14px;height:14px;background:{{ a.rankBg }};color:{{ a.rankFg }};font-size:9.5px;font-weight:700;line-height:1;align-items:center;justify-content:center;display:{{ a.rankShow }}">{{ a.rank }}</span>
                    <span style="font-family:'IBM Plex Sans KR',sans-serif;font-size:{{ a.tileFs }};font-weight:600;letter-spacing:-0.02em;white-space:pre-line;text-align:center;line-height:1.25;flex-shrink:0;transition:font-size .3s ease">{{ a.code }}</span>
                    <span style="font-size:13px;font-weight:600;letter-spacing:-0.01em;display:{{ a.metaShow }}">{{ a.riskLabel }}</span>
                    <span style="position:absolute;bottom:0;left:0;height:2.5px;width:{{ a.barW }};background:{{ a.barColor }};transition:width 2.8s linear"></span>
                  </button>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>
      </sc-for>
      <div style="display:flex;flex-wrap:wrap;gap:10px;border-top:1px solid #DDE6F0;padding-top:9px">
        <sc-for list="{{ legend }}" as="g" hint-placeholder-count="4">
          <span style="display:flex;align-items:center;gap:5px;font-size:10.5px;color:#4A5C74;font-weight:500">
            <span style="width:10px;height:10px;background:{{ g.color }};border:1px solid {{ g.line }};display:block"></span>{{ g.label }}
          </span>
        </sc-for>
      </div>
    </div>

    <sc-if value="{{ isMaint }}" hint-placeholder-val="{{ false }}">
      <div style="background:#FFFFFF;border:1px solid #CBD8E8;padding:13px 14px 15px;display:flex;flex-direction:column;gap:11px;min-width:0">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid #DDE6F0;padding-bottom:8px">
          <h2 style="margin:0;font-size:15px;font-weight:700;letter-spacing:-0.01em;white-space:nowrap">작업 카드</h2>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#4A5C74">{{ curReqId }} · {{ curReqState }}</span>
        </div>
<div aria-label="AI 브리핑" style="border-bottom:1px solid #DDE6F0;padding:6px 0 10px;display:flex;flex-direction:column;gap:6px">
<div style="display:flex;align-items:center;gap:8px;font-size:11px;color:#697C92"><strong>AI 브리핑</strong><span>{{ aiStatus }}</span><button type="button" onClick="{{ onAiSummary }}" disabled="{{ aiDisabled }}" title="{{ aiHelp }}" style="margin-left:auto;font-family:inherit;padding:3px 7px;border:1px solid #CBD8E8;background:#F8FBFE;color:#365476">{{ aiButtonLabel }}</button></div>
<sc-if value="{{ aiBriefVisible }}"><div style="font-size:11px;line-height:1.5;color:#697C92">{{ aiAvailabilityNote }}</div><div style="font-size:11px;color:#697C92">{{ aiBasis }}</div><sc-if value="{{ aiBriefHasRows }}"><div style="display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.68;color:#2C4159"><sc-for list="{{ aiBriefRows }}" as="brief"><div style="overflow-wrap:anywhere"><sc-for list="{{ brief.parts }}" as="part"><span style="font-weight:{{ part.weight }}">{{ part.text }}</span></sc-for><sc-for list="{{ brief.refs }}" as="ref"><details style="font-size:11px;color:#697C92;margin-top:2px"><summary style="cursor:pointer">{{ ref.label }}</summary><code style="white-space:normal;overflow-wrap:anywhere">{{ ref.text }}</code></details></sc-for></div></sc-for></div></sc-if><sc-if value="{{ aiBriefEmpty }}"><div style="font-size:13px;line-height:1.6;color:#2C4159">{{ priorityHead }}</div></sc-if></sc-if>
</div>
        <div style="display:flex;flex-direction:column;gap:4px">
          <div style="display:flex;align-items:baseline;gap:9px;flex-wrap:wrap">
            <span style="font-size:15px;font-weight:700;color:#0F1E33">{{ curReqAsset }}</span>
            <span style="font-size:12px;color:#4A5C74;font-weight:500">{{ curReqWhat }}</span>
          </div>
          <span style="font-size:11px;color:#566B85">요청 {{ curReqFrom }} · 담당 {{ curReqAssignee }}</span>
        </div>
        <div style="display:flex;align-items:flex-start;gap:10px;border:1px solid #DDE6F0;background:#F8FBFE;padding:10px 12px">
          <span style="flex:none;width:22px;height:22px;background:#003C96;color:#FFFFFF;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">{{ curReqTargetNo }}</span>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
            <span style="font-size:13.5px;font-weight:700;color:#0F1E33">{{ curReqTargetName }}</span>
            <span style="font-size:11.5px;color:#4A5C74;line-height:1.5">위치 {{ curReqWhere }}</span>
            <span style="font-size:11.5px;color:#4A5C74;line-height:1.5;text-wrap:pretty">{{ curReqHow }}</span>
          </div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#003C96;font-weight:500">{{ curReqSop }}</span>
          <span style="font-size:10.5px;font-weight:700;color:{{ curReqSafetyColor }};border:1px solid {{ curReqSafetyColor }}55;padding:2px 6px;white-space:nowrap">{{ curReqSafety }}</span>
        </div>
        <ul style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px">
          <sc-for list="{{ curReqChecks }}" as="ck" hint-placeholder-count="3">
            <li style="display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.55;color:#1E3450">
              <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#5F7590;flex:none;padding-top:2px">{{ ck.no }}</span>
              <span style="text-wrap:pretty">{{ ck.text }}</span>
            </li>
          </sc-for>
        </ul>
<div style="border:1px solid #C3D3E6;background:#F8FBFE;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:12px;line-height:1.6" aria-label="보전 점검과 조치">
<strong>{{ flowTitle }}</strong><span style="font-size:11px;color:#566B85">{{ flowSummary }}</span>
<sc-if value="{{ flowInspect }}"><label>현장 점검 결과<textarea class="recovery-input" style="width:100%;box-sizing:border-box;min-height:55px;font-family:inherit" aria-label="현장 점검 결과" value="{{ flowInspection }}" onChange="{{ onFlowInspection }}"></textarea></label><label>필요 조치<input class="recovery-input" style="width:100%;box-sizing:border-box;font-family:inherit" aria-label="필요 조치" value="{{ flowProposal }}" onChange="{{ onFlowProposal }}" /></label><div style="display:flex;flex-wrap:wrap;gap:10px"><label>정지 시간 <input class="recovery-input" type="number" min="0.5" max="8" step="0.5" aria-label="필요 정지 시간" value="{{ flowHours }}" onChange="{{ onFlowHours }}" /> 시간</label><label>제안 일정 <input class="recovery-input" style="width:150px;font-family:inherit" aria-label="제안 일정" value="{{ flowSlot }}" onChange="{{ onFlowSlot }}" /></label></div><label>영향 품목 <select aria-label="영향 품목" class="recovery-input" style="width:auto;font-family:inherit" value="{{ flowSku }}" onChange="{{ onFlowSku }}"><option value="">품목 연결 확인</option><option value="0">A형 하우징</option><option value="1">B형 브래킷</option><option value="2">C형 커버</option></select></label><span style="font-size:11px;color:#566B85">품목·예상 정지시간·일정 저장 계약 확인이 필요합니다.</span><button type="button" class="recovery-button" onClick="{{ onFlowNoAction }}" disabled="{{ flowNoActionDisabled }}">조치 불필요 · 점검 결과 회신</button></sc-if>
<sc-if value="{{ flowReady }}"><label><input type="checkbox" checked="{{ flowReadyChecked }}" onChange="{{ onFlowReady }}" /> 부품·인력·작업 허가·착수 조건 확인 필요</label><button type="button" class="recovery-button" onClick="{{ onFlowRevisit }}">조건 부족 · 일정 재협의</button></sc-if>
<sc-if value="{{ flowWorking }}"><label>작업 후 점검 결과<textarea class="recovery-input" style="width:100%;box-sizing:border-box;min-height:55px;font-family:inherit" aria-label="작업 후 점검 결과" value="{{ flowResult }}" onChange="{{ onFlowResult }}"></textarea></label></sc-if>
<button type="button" class="recovery-button" onClick="{{ onFlowAdvance }}" disabled="{{ flowDisabled }}">{{ flowAction }}</button>

    <div onClick="{{ onFocusChart }}" style="display:{{ chartPanelShow }};background:#FFFFFF;border:1px solid #CBD8E8;padding:13px 14px 12px;flex-direction:column;gap:10px;min-width:0;cursor:{{ chartCursor }}">

<div aria-label="AI 브리핑" style="border-bottom:1px solid #DDE6F0;padding:6px 0 10px;display:flex;flex-direction:column;gap:6px">

        <svg viewBox="0 0 352 300" preserveAspectRatio="none" style="width:100%;height:{{ chartH }};display:block;transition:height .36s cubic-bezier(.2,0,0,1)" role="img">
          <rect x="0" y="0" width="352" height="{{ bandWarnH }}" fill="#FBEEEB"></rect>

              <path d="{{ chartArea }}" fill="{{ selFill }}"></path>

          </g>

        </div>
        <div style="flex:none;width:30px;position:relative">
          <sc-if value="{{ showBands }}"><span style="position:absolute;top:{{ labWarnPct }};transform:translateY(-50%);font-size:11px;font-weight:700;color:#8E2A1D">위험</span></sc-if>
