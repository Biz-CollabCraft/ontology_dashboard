name: generator-runtime-pipeline

on:
  pull_request:
    paths:
      - "contracts/schemas/generator-pipeline-run-state.schema.json"
      - "contracts/schemas/generator-runtime-feature.schema.json"
      - "contracts/schemas/generator-model-prediction-result.schema.json"
      - "contracts/schemas/prediction-result-batch.schema.json"
      - "contracts/schemas/generator-runtime-prediction-stage.schema.json"
      - "contracts/test-vectors/generator-runtime-prediction-v1/**"
      - "systems/generator/**"
      - "tests/test_runtime_input_context.py"
      - "tests/test_generator_runtime_pipeline.py"
      - "tests/test_runtime_overlay_generator_enqueue.py"
      - ".github/workflows/generator-runtime-pipeline.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/schemas/generator-pipeline-run-state.schema.json"
      - "contracts/schemas/generator-runtime-feature.schema.json"
      - "contracts/schemas/generator-model-prediction-result.schema.json"
      - "contracts/schemas/prediction-result-batch.schema.json"
      - "contracts/schemas/generator-runtime-prediction-stage.schema.json"
      - "contracts/test-vectors/generator-runtime-prediction-v1/**"
      - "systems/generator/**"
      - "tests/test_runtime_input_context.py"
      - "tests/test_generator_runtime_pipeline.py"
      - "tests/test_runtime_overlay_generator_enqueue.py"
      - ".github/workflows/generator-runtime-pipeline.yml"
  workflow_dispatch:

concurrency:
  group: generator-runtime-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generator-runtime-pipeline:
    name: generator-runtime-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Build Generator runtime image
        run: docker build --file systems/generator/Dockerfile --tag ontology-generator:runtime-check .

      - name: Run Runtime Pipeline tests inside image
        run: >-
          docker run --rm
          --user 0:0
          --entrypoint sh
          --env DATA_DIR=/data/source
          --env DATA_PREPROCESSED_DIR=/data/preprocessed
          --env ONTOLOGY_DIR=/data/ontology
          --env MODELS_STORE_DIR=/data/models
          --env MODEL_ARTIFACT_URI=/artifacts
          --volume "${{ github.workspace }}/tests:/app/tests:ro"
          --volume "${{ github.workspace }}/contracts:/app/contracts:ro"
          ontology-generator:runtime-check
          -c "python -m pip install --no-cache-dir pytest && python -m pytest -q tests/test_runtime_input_context.py tests/test_generator_runtime_pipeline.py tests/test_runtime_overlay_generator_enqueue.py"
