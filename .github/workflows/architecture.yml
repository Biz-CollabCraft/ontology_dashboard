name: architecture

on:
  pull_request:
  push:
    branches:
      - main
      - feat/systems-scaffolding

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Static architecture rules
        run: python systems/verify_architecture.py

      - name: Generator import smoke
        working-directory: systems/generator
        run: python -c "import extraction; import ontology_mapping; import topology; import feature; import model; import common"

      - name: Install backend dependencies
        working-directory: systems/backend
        run: pip install -e ../../ml -e .

      - name: Backend import and health
        working-directory: systems/backend
        run: |
          APP_ENV=test PYTHONPATH=../..:../../ml/src python -c "from fastapi.testclient import TestClient; from app.main import app; response=TestClient(app).get('/health'); assert response.status_code == 200, response.text"
          APP_ENV=test PYTHONPATH=../..:../../ml/src uvicorn app.main:app --host 127.0.0.1 --port 18000 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          success=0
          for attempt in {1..20}; do
            if curl --fail --silent --output /tmp/health.json http://127.0.0.1:18000/health; then
              cat /tmp/health.json
              success=1
              break
            fi
            sleep 0.5
          done
          test "$success" -eq 1
          python -c "import json; payload=json.load(open('/tmp/health.json')); assert payload['status'] == 'ok', payload"

      - name: Backend non-editable runtime root smoke
        working-directory: systems/backend
        env:
          APP_ENV: test
          ONTOLOGY_DASHBOARD_PROJECT_ROOT: ${{ github.workspace }}
        run: |
          rm -rf /tmp/ontology-dashboard-site
          python -m pip install --no-deps --target /tmp/ontology-dashboard-site .
          cd /tmp
          PYTHONPATH=/tmp/ontology-dashboard-site:"${GITHUB_WORKSPACE}/ml/src" python - <<'PY'
          import os
          from pathlib import Path

          import ontology_dashboard
          from ontology_dashboard.application import ROOT as application_root
          from ontology_dashboard.dependencies import ROOT as dependencies_root
          from ontology_dashboard.routers import platform, system
          from ontology_dashboard.settings import project_root

          expected = Path(os.environ["ONTOLOGY_DASHBOARD_PROJECT_ROOT"]).resolve()
          installed_package = Path(ontology_dashboard.__file__).resolve()
          installed_root = Path("/tmp/ontology-dashboard-site").resolve()
          assert installed_package.is_relative_to(installed_root), installed_package
          assert project_root() == expected
          assert application_root == expected
          assert dependencies_root == expected
          assert system.ROOT == expected
          assert platform.project_root() == expected
          assert (expected / "schemas").is_dir()
          assert (expected / "prompts").is_dir()
          assert (expected / "data" / "fixtures").is_dir()
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: systems/frontend
        run: npm install --no-audit --no-fund

      - name: Frontend production build
        working-directory: systems/frontend
        run: npm run build

      - name: Docker Compose runtime smoke
        shell: bash
        run: |
          docker version
          docker compose version
          docker compose -f infra/docker-compose.yml build api web
          docker compose -f infra/docker-compose.yml up -d api web

          api_ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --output /tmp/docker-api-health.json http://127.0.0.1:8100/health; then
              cat /tmp/docker-api-health.json
              api_ready=1
              break
            fi
            sleep 2
          done
          test "$api_ready" -eq 1

          web_ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --output /tmp/docker-web-health.json http://127.0.0.1:3100/health/live; then
              cat /tmp/docker-web-health.json
              web_ready=1
              break
            fi
            sleep 2
          done
          test "$web_ready" -eq 1

      - name: Docker Compose diagnostics
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color

      - name: Docker Compose cleanup
        if: always()
        run: docker compose -f infra/docker-compose.yml down --volumes --remove-orphans

      - name: Diff whitespace check
        shell: bash
        run: |
          if [[ -n "${{ github.base_ref }}" ]]; then
            base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
            git diff --check "$base"...HEAD
          else
            git show --check --oneline --no-renames HEAD
          fi
