name: architecture

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled]
  push:
    branches:
      - main
      - feat/systems-scaffolding

# A new PR update supersedes the previous architecture run for the same PR/ref.
# This keeps the required check current instead of queueing obsolete E2E and
# Compose work after rapid pushes.
concurrency:
  group: architecture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify architecture scope
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.changes.outputs.full }}
      generator: ${{ steps.changes.outputs.generator }}
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      integration: ${{ steps.changes.outputs.integration }}
      docker: ${{ steps.changes.outputs.docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # Keep the required `architecture` job running for every PR. Only the
          # expensive domain/integration steps are selected from the diff.
          full=false
          generator=false
          backend=false
          frontend=false
          integration=false
          docker=false

          if [[ "$EVENT_NAME" == "push" ]]; then
            full=true
          else
            base="$(git merge-base HEAD "origin/${BASE_REF}")"
            mapfile -t changed_files < <(git diff --name-only "$base"...HEAD)

            echo "Changed files:"
            printf ' - %s\n' "${changed_files[@]}"

            for path in "${changed_files[@]}"; do
              case "$path" in
                docs/*|README.md|THIRD_PARTY_NOTICES.md)
                  # Explicitly safe documentation-only changes keep the
                  # expensive validation steps disabled.
                  ;;
                .dockerignore)
                  # The repository root is the Docker build context for both
                  # backend and frontend images, so .dockerignore changes must
                  # exercise the runtime image build/start smoke.
                  docker=true
                  ;;
                .github/workflows/*|systems/verify_architecture.py)
                  full=true
                  ;;
                systems/generator/*)
                  generator=true
                  ;;
                systems/backend/*)
                  backend=true
                  integration=true
                  docker=true
                  ;;
                systems/frontend/*)
                  frontend=true
                  integration=true
                  docker=true
                  ;;
                contracts/*|schemas/*)
                  generator=true
                  backend=true
                  integration=true
                  docker=true
                  ;;
                ml/*)
                  generator=true
                  backend=true
                  integration=true
                  ;;
                infra/*|render.yaml)
                  docker=true
                  ;;
                data/fixtures/*|prompts/*)
                  backend=true
                  integration=true
                  ;;
                tests/*|scripts/*)
                  full=true
                  ;;
                *)
                  # Fail closed for paths the classifier does not know yet.
                  # New top-level config files/directories must not silently
                  # bypass runtime validation until their impact is classified.
                  full=true
                  ;;
              esac
            done
          fi

          if [[ "$full" == "true" ]]; then
            generator=true
            backend=true
            frontend=true
            integration=true
            docker=true
          fi

          {
            echo "full=$full"
            echo "generator=$generator"
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "integration=$integration"
            echo "docker=$docker"
          } >> "$GITHUB_OUTPUT"

          echo "CI scope: full=$full generator=$generator backend=$backend frontend=$frontend integration=$integration docker=$docker"

  fast_validation:
    name: Fast validation
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      frontend_unit_verified: ${{ steps.frontend_unit.outputs.verified }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            systems/backend/pyproject.toml
            ml/pyproject.toml
            systems/generator/requirements.txt

      - name: Static architecture rules
        env:
          BACKEND_MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: python systems/verify_architecture.py

      - name: Backend migration ratchet negative fixtures
        run: |
          python -m unittest tests.test_backend_migration_ratchet
          python -m unittest tests.test_backend_domain_first_architecture

      - name: Install Python dependencies
        if: needs.changes.outputs.generator == 'true' || needs.changes.outputs.backend == 'true'
        run: |
          python -m pip install -e ./ml -e './systems/backend[dev]' -r systems/generator/requirements.txt

      - name: Backend migration architecture regressions
        if: needs.changes.outputs.backend == 'true'
        run: |
          python -m pytest -q \
            tests/test_backend_migration_map.py \
            tests/test_backend_migration_ledger.py \
            tests/test_architecture_debt_stage44.py

      - name: Generator import smoke
        if: needs.changes.outputs.generator == 'true'
        working-directory: systems/generator
        run: python -c "import extraction; import ontology_mapping; import topology; import feature; import model; import common"

      - name: Generator daemon tests
        if: needs.changes.outputs.generator == 'true'
        run: python -m pytest -q tests/test_generator_daemon.py

      - name: Backend import and health
        if: needs.changes.outputs.backend == 'true'
        working-directory: systems/backend
        run: |
          APP_ENV=test PYTHONPATH=../..:../../ml/src python -c "from fastapi.testclient import TestClient; from app.main import app; response=TestClient(app).get('/health'); assert response.status_code == 200, response.text"
          APP_ENV=test PYTHONPATH=../..:../../ml/src uvicorn app.main:app --host 127.0.0.1 --port 18000 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          success=0
          for attempt in {1..20}; do
            if curl --fail --silent --output /tmp/health.json http://127.0.0.1:18000/health; then
              cat /tmp/health.json
              success=1
              break
            fi
            sleep 0.5
          done
          test "$success" -eq 1
          python -c "import json; payload=json.load(open('/tmp/health.json')); assert payload['status'] == 'ok', payload"

      - name: Backend non-editable runtime root smoke
        if: needs.changes.outputs.backend == 'true'
        working-directory: systems/backend
        env:
          APP_ENV: test
          ONTOLOGY_DASHBOARD_PROJECT_ROOT: ${{ github.workspace }}
        run: |
          rm -rf /tmp/ontology-dashboard-site
          python -m pip install --no-deps --target /tmp/ontology-dashboard-site .
          cd /tmp
          PYTHONPATH=/tmp/ontology-dashboard-site:"${GITHUB_WORKSPACE}/ml/src" python - <<'PY'
          import os
          from pathlib import Path

          import ontology_dashboard
          from ontology_dashboard.application import ROOT as application_root
          from ontology_dashboard.dependencies import ROOT as dependencies_root
          from ontology_dashboard.routers import platform, system
          from app.common.runtime_settings import project_root

          expected = Path(os.environ["ONTOLOGY_DASHBOARD_PROJECT_ROOT"]).resolve()
          installed_package = Path(ontology_dashboard.__file__).resolve()
          installed_root = Path("/tmp/ontology-dashboard-site").resolve()
          assert installed_package.is_relative_to(installed_root), installed_package
          assert project_root() == expected
          assert application_root == expected
          assert dependencies_root == expected
          assert system.ROOT == expected
          assert platform.project_root() == expected
          assert (expected / "contracts" / "schemas").is_dir()
          assert (expected / "prompts").is_dir()
          assert (expected / "data" / "fixtures").is_dir()
          PY

      - name: Set up Node
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: systems/frontend/package-lock.json

      - name: Install frontend dependencies
        if: needs.changes.outputs.frontend == 'true'
        working-directory: systems/frontend
        run: npm ci --no-audit --no-fund

      - name: Frontend unit tests
        if: needs.changes.outputs.frontend == 'true'
        id: frontend_unit
        working-directory: systems/frontend
        run: |
          npm test
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Frontend production build
        if: needs.changes.outputs.frontend == 'true'
        working-directory: systems/frontend
        run: npm run build

      - name: Diff whitespace check
        shell: bash
        run: |
          if [[ -n "${{ github.base_ref }}" ]]; then
            base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
            git diff --check "$base"...HEAD
          else
            git show --check --oneline --no-renames HEAD
          fi

  mvp_e2e:
    name: Playwright MVP E2E
    needs: changes
    if: ${{ needs.changes.outputs.integration == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      verified: ${{ steps.mvp_e2e.outputs.verified }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            systems/backend/pyproject.toml
            ml/pyproject.toml
            systems/generator/requirements.txt

      - name: Install Python dependencies for MVP runtime
        run: |
          python -m pip install -e ./ml -e './systems/backend[dev]' -r systems/generator/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: systems/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: systems/frontend
        run: npm ci --no-audit --no-fund

      - name: Restore Playwright Chromium cache
        id: playwright_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('systems/frontend/package-lock.json') }}

      - name: Install Playwright Chromium and system dependencies
        working-directory: systems/frontend
        # Keep --with-deps on cache hits: browser files do not guarantee that
        # a fresh runner still has every operating-system dependency.
        run: npx playwright install --with-deps chromium

      - name: Critical MVP Playwright smoke
        id: mvp_e2e
        working-directory: systems/frontend
        env:
          PLAYWRIGHT_PYTHON_BIN: python
        run: |
          npm run test:e2e:mvp
          echo "verified=true" >> "$GITHUB_OUTPUT"

  docker_runtime:
    name: Docker runtime smoke
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      verified: ${{ steps.docker_runtime.outputs.verified }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Compose runtime smoke
        id: docker_runtime
        shell: bash
        run: |
          docker version
          docker compose version
          docker compose -f infra/docker-compose.yml build api web
          docker compose -f infra/docker-compose.yml up -d api web

          api_ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --output /tmp/docker-api-health.json http://127.0.0.1:8100/health; then
              cat /tmp/docker-api-health.json
              api_ready=1
              break
            fi
            sleep 2
          done
          test "$api_ready" -eq 1

          web_ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --output /tmp/docker-web-health.json http://127.0.0.1:3100/health/live; then
              cat /tmp/docker-web-health.json
              web_ready=1
              break
            fi
            sleep 2
          done
          test "$web_ready" -eq 1

          docker compose -f infra/docker-compose.yml exec -T api python - <<'PY'
          import os
          from pathlib import Path

          from ontology_dashboard.dependencies import get_artifact_governance_service

          assert os.getuid() == 10001, os.getuid()
          service = get_artifact_governance_service()
          root = Path(service.backend.root).resolve()
          expected_root = Path("/app/.runtime/object-storage")
          assert root == expected_root, (root, expected_root)

          probe_key = "ci/docker-runtime/artifact-storage-smoke.txt"
          payload = b"ontology-dashboard-artifact-storage-smoke"
          service.backend.put(
              probe_key,
              payload,
              media_type="text/plain",
              metadata={"source": "architecture-ci"},
          )
          assert service.backend.get(probe_key) == payload
          service.backend.delete(probe_key)
          assert service.backend.head(probe_key) is None
          print(f"artifact_storage_root={root}")
          print("artifact_storage_write_read_delete=ok")
          PY
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Docker Compose diagnostics
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color

      - name: Docker Compose cleanup
        if: always()
        run: docker compose -f infra/docker-compose.yml down --volumes --remove-orphans

  # Keep this job name as the required branch-protection check. It turns a
  # selected child validation into a required success instead of allowing a
  # skipped child to look like a passing architecture check.
  architecture:
    name: architecture
    needs: [changes, fast_validation, mvp_e2e, docker_runtime]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      docker_runtime_required: ${{ needs.changes.outputs.docker }}
      docker_runtime_verified: ${{ needs.docker_runtime.outputs.verified }}
      frontend_unit_required: ${{ needs.changes.outputs.frontend }}
      frontend_unit_verified: ${{ needs.fast_validation.outputs.frontend_unit_verified }}
      mvp_e2e_required: ${{ needs.changes.outputs.integration }}
      mvp_e2e_verified: ${{ needs.mvp_e2e.outputs.verified }}
    steps:
      - name: Verify selected validation results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FAST_VALIDATION_RESULT: ${{ needs.fast_validation.result }}
          MVP_E2E_RESULT: ${{ needs.mvp_e2e.result }}
          MVP_E2E_REQUIRED: ${{ needs.changes.outputs.integration }}
          MVP_E2E_VERIFIED: ${{ needs.mvp_e2e.outputs.verified }}
          DOCKER_RUNTIME_RESULT: ${{ needs.docker_runtime.result }}
          DOCKER_RUNTIME_REQUIRED: ${{ needs.changes.outputs.docker }}
          DOCKER_RUNTIME_VERIFIED: ${{ needs.docker_runtime.outputs.verified }}
        run: |
          set -euo pipefail

          test "$CHANGES_RESULT" = "success"
          test "$FAST_VALIDATION_RESULT" = "success"

          assert_required_success() {
            local label="$1"
            local required="$2"
            local result="$3"
            local verified="$4"

            if [[ "$required" != "true" ]]; then
              echo "$label: not required for this diff"
              return
            fi

            test "$result" = "success"
            test "$verified" = "true"
            echo "$label: required and verified"
          }

          assert_required_success "MVP Playwright E2E" "$MVP_E2E_REQUIRED" "$MVP_E2E_RESULT" "$MVP_E2E_VERIFIED"
          assert_required_success "Docker runtime smoke" "$DOCKER_RUNTIME_REQUIRED" "$DOCKER_RUNTIME_RESULT" "$DOCKER_RUNTIME_VERIFIED"

  review:
    needs: architecture
    if: >-
      ${{ always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai-review') &&
      (github.event.action != 'synchronize' || contains(github.event.pull_request.labels.*.name, 'ai-review')) &&
      (!github.event.pull_request.draft || github.event.action == 'ready_for_review' || contains(github.event.pull_request.labels.*.name, 'ai-review')) }}
    permissions:
      actions: read
      contents: read
      issues: write
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/code-review.yml
    with:
      architecture_result: ${{ needs.architecture.result }}
      docker_runtime_required: ${{ needs.architecture.outputs.docker_runtime_required }}
      docker_runtime_verified: ${{ needs.architecture.outputs.docker_runtime_verified }}
      frontend_unit_required: ${{ needs.architecture.outputs.frontend_unit_required }}
      frontend_unit_verified: ${{ needs.architecture.outputs.frontend_unit_verified }}
      mvp_e2e_required: ${{ needs.architecture.outputs.mvp_e2e_required }}
      mvp_e2e_verified: ${{ needs.architecture.outputs.mvp_e2e_verified }}
      workflow_run_id: ${{ github.run_id }}
      pr_number: ${{ github.event.pull_request.number }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      pr_title: ${{ github.event.pull_request.title }}
      pr_body: ${{ github.event.pull_request.body }}
