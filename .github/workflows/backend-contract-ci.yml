name: backend-contract-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # Keep the required job present even for docs-only PRs; selectively
          # skip dependency installation and contract tests when they cannot be affected.

          run_contract=false
          if [[ "$EVENT_NAME" == "push" ]]; then
            run_contract=true
          else
            base="$(git merge-base HEAD "origin/${BASE_REF}")"
            mapfile -t changed_files < <(git diff --name-only "$base"...HEAD)

            echo "Changed files:"
            printf ' - %s\n' "${changed_files[@]}"

            for path in "${changed_files[@]}"; do
              case "$path" in
                .github/workflows/*|systems/verify_architecture.py|systems/backend/*|systems/generator/*|ml/*|contracts/*|schemas/*|data/fixtures/*|tests/test_product_result_artifact_evidence_contract.py|tests/test_product_result_evidence_enrichment.py|tests/test_system_ownership.py)
                  run_contract=true
                  break
                  ;;
              esac
            done
          fi

          echo "run_contract=$run_contract" >> "$GITHUB_OUTPUT"
          echo "Backend contract scope: run_contract=$run_contract"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            systems/backend/pyproject.toml
            ml/pyproject.toml

      - name: Static architecture and Generator import-safety rules
        env:
          BACKEND_MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: python systems/verify_architecture.py

      - name: Install Backend contract test dependencies
        if: steps.changes.outputs.run_contract == 'true'
        run: python -m pip install -e ./ml -e './systems/backend[dev]' -r systems/generator/requirements.txt

      - name: Validate JSON Schema documents
        if: steps.changes.outputs.run_contract == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema.validators import validator_for

          schema_paths = sorted(Path("contracts/schemas").glob("*.schema.json"))
          if not schema_paths:
              raise SystemExit("no JSON Schema documents found under contracts/schemas/")

          for path in schema_paths:
              schema = json.loads(path.read_text(encoding="utf-8"))
              validator_cls = validator_for(schema)
              validator_cls.check_schema(schema)
              print(f"validated {path}")
          PY

      - name: Backend Product Result and Evidence contract tests
        if: steps.changes.outputs.run_contract == 'true'
        env:
          APP_ENV: test
        run: >
          pytest -q
          tests/test_demo_predictive_maintenance_bootstrap.py
          tests/test_product_result_artifact_evidence_contract.py
          tests/test_product_result_evidence_enrichment.py
          tests/test_predictive_maintenance_result_replay.py

      - name: Model Artifact publish-validation-load round-trip
        if: steps.changes.outputs.run_contract == 'true'
        env:
          APP_ENV: test
        run: pytest -q tests/test_system_ownership.py

      - name: Diff whitespace check
        shell: bash
        run: |
          if [[ -n "${{ github.base_ref }}" ]]; then
            base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
            git diff --check "$base"...HEAD
          else
            git show --check --oneline --no-renames HEAD
          fi
