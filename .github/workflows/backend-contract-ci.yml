name: backend-contract-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            systems/backend/pyproject.toml
            ml/pyproject.toml

      - name: Static architecture and Generator import-safety rules
        run: python systems/verify_architecture.py

      - name: Install Backend contract test dependencies
        run: python -m pip install -e ./ml -e './systems/backend[dev]'

      - name: Validate JSON Schema documents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema.validators import validator_for

          schema_paths = sorted(Path("contracts/schemas").glob("*.schema.json"))
          if not schema_paths:
              raise SystemExit("no JSON Schema documents found under contracts/schemas/")

          for path in schema_paths:
              schema = json.loads(path.read_text(encoding="utf-8"))
              validator_cls = validator_for(schema)
              validator_cls.check_schema(schema)
              print(f"validated {path}")
          PY

      - name: Backend Product Result and Evidence contract tests
        env:
          APP_ENV: test
        run: >
          pytest -q
          tests/test_product_result_artifact_evidence_contract.py
          tests/test_product_result_evidence_enrichment.py

      - name: Model Artifact publish-validation-load round-trip
        env:
          APP_ENV: test
        run: pytest -q tests/test_system_ownership.py

      - name: Diff whitespace check
        shell: bash
        run: |
          if [[ -n "${{ github.base_ref }}" ]]; then
            base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
            git diff --check "$base"...HEAD
          else
            git show --check --oneline --no-renames HEAD
          fi
